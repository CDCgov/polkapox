name: variant_convert
description: Convert a filtered iVar variants TSV into VCF format
keywords:
  - ivar
  - vcf
  - variants
  - conversion
tools:
  - variant_convert:
      description: Pipeline-bundled Python script (bin/ivar2vcf.py, uses bionumpy) that converts iVar TSV variant calls to VCF
      homepage: https://github.com/CDCgov/polkapox
      documentation: https://github.com/CDCgov/polkapox
      licence: ["Apache-2.0"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - tsv:
        type: file
        description: iVar variants TSV for this sample
        pattern: "*.tsv"
        ontologies: []
  - af_cutoff:
      type: number
      description: Minimum allele frequency required to report a variant
output:
  vcf:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.vcf":
          type: file
          description: Converted VCF of variant calls
          pattern: "*.vcf"
          ontologies: []
  versions_python:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - "python3 --version | sed \"s/Python //g\"":
          type: string
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - "python3 --version | sed \"s/Python //g\"":
          type: string
          description: The command used to generate the version of the tool
authors:
  - "@CDCgov/polkapox"
maintainers:
  - "@CDCgov/polkapox"
