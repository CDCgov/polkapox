name: unicycler
description: Assembles bacterial genomes
keywords:
  - genome
  - assembly
  - genome assembler
  - small genome
tools:
  - unicycler:
      description: Hybrid assembly pipeline for bacterial genomes
      homepage: https://github.com/rrwick/Unicycler
      documentation: https://github.com/rrwick/Unicycler
      tool_dev_url: https://github.com/rrwick/Unicycler
      doi: 10.1371/journal.pcbi.1005595
      licence: ["GPL v3"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - shortreads:
        type: file
        description: |
          List of input Illumina FastQ files of size 1 and 2 for single-end and paired-end data,
          respectively.
        ontologies: []
output:
  scaffolds:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.scaffolds.fa.gz":
          type: file
          description: Fasta file containing scaffolds
          pattern: "*.{scaffolds.fa.gz}"
          ontologies: []
  gfa:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*bridges_applied.gfa":
          type: file
          description: gfa file containing assembly
          pattern: "*.{assembly.gfa.gz}"
          ontologies: []
  log:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.log":
          type: file
          description: unicycler log file
          pattern: "*.{log}"
          ontologies: []
  versions_unicycler:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - unicycler:
          type: string
          description: The tool name
      - "unicycler --version 2>&1 | sed \"s/^.*Unicycler v//; s/ .*$//\"":
          type: string
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - unicycler:
          type: string
          description: The tool name
      - "unicycler --version 2>&1 | sed \"s/^.*Unicycler v//; s/ .*$//\"":
          type: string
          description: The command used to generate the version of the tool
authors:
  - "@JoseEspinosa"
  - "@drpatelh"
  - "@d4straub"
maintainers:
  - "@JoseEspinosa"
  - "@drpatelh"
  - "@d4straub"
