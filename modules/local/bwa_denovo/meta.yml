name: bwa_denovo
description: Align short reads against a de novo-assembled reference with BWA-MEM, sort, and index the resulting BAM
keywords:
  - alignment
  - bwa
  - mem
  - sort
  - de novo
tools:
  - bwa:
      description: Burrows-Wheeler Alignment tool
      homepage: http://bio-bwa.sourceforge.net/
      documentation: http://www.htslib.org/doc/samtools.html
      doi: 10.1093/bioinformatics/btp324
      licence: ["GPL-3.0-or-later"]
      identifier: biotools:bwa
  - samtools:
      description: Tools for manipulating SAM/BAM/CRAM files
      homepage: http://www.htslib.org/
      documentation: http://www.htslib.org/doc/samtools.html
      doi: 10.1093/bioinformatics/btp352
      licence: ["MIT"]
      identifier: biotools:samtools
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: Reference FASTA to index and align against (the de novo assembly)
        pattern: "*.{fa,fasta}"
        ontologies: []
    - reads:
        type: file
        description: List of input FastQ files of size 1 (single-end) or 2 (paired-end)
        ontologies: []
  - sort_bam:
      type: boolean
      description: Whether to coordinate-sort (true) or leave as-is via `samtools view` (false)
output:
  bam:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.bam":
          type: file
          description: Output BAM file
          pattern: "*.bam"
          ontologies: []
  bambai:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.bam":
          type: file
          description: Output BAM file
          pattern: "*.bam"
          ontologies: []
      - "*.bai":
          type: file
          description: BAM index file
          pattern: "*.bai"
          ontologies: []
  bai:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.bai":
          type: file
          description: BAM index file
          pattern: "*.bai"
          ontologies: []
  versions_bwa:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - bwa:
          type: string
          description: The tool name
      - "bwa 2>&1 | sed \"s/^.*Version: //; s/Contact:.*$//\"":
          type: string
          description: The command used to generate the version of the tool
  versions_samtools:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - samtools:
          type: string
          description: The tool name
      - "samtools --version 2>&1 | sed \"s/^.*samtools //; s/Using.*$//\"":
          type: string
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - bwa:
          type: string
          description: The tool name
      - "bwa 2>&1 | sed \"s/^.*Version: //; s/Contact:.*$//\"":
          type: string
          description: The command used to generate the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - samtools:
          type: string
          description: The tool name
      - "samtools --version 2>&1 | sed \"s/^.*samtools //; s/Using.*$//\"":
          type: string
          description: The command used to generate the version of the tool
authors:
  - "@CDCgov/polkapox"
maintainers:
  - "@CDCgov/polkapox"
